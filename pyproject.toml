[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effective-memory"
version = "0.2.0"
description = "A local-first memory engine: semantic recall for agents, a linkable personal knowledge store, and forgetting-curve-based compaction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx2", "ruff>=0.6", "mypy>=1.10"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]
voyage = ["voyageai>=0.2"]
openai = ["openai>=1.0"]
sentence-transformers = ["sentence-transformers>=2.2"]
llm = ["anthropic>=0.40"]
vector-index = ["sqlite-vec>=0.1"]

[project.scripts]
emem = "effective_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effective_memory = ["web/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults: a ruff upgrade
# (0.15 -> 0.16) silently expanded its default rule set and broke CI on
# code nothing here had changed. This list is deliberately chosen and only
# grows when a rule is reviewed and added on purpose.
select = [
    "E4", "E7", "E9", "F", # ruff's own stable defaults (pyflakes + a few pycodestyle checks)
    "UP035", "UP037", "UP045", # pyupgrade: modern typing syntax (repo requires Python >=3.10)
    "RUF017", "RUF022", # ruff-specific: quadratic list build, unsorted __all__
    "PLR0402", # `import x.y as y` -> `from x import y`
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
