[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effective-memory"
version = "0.2.0"
description = "A local-first memory engine: semantic recall for agents, a linkable personal knowledge store, and forgetting-curve-based compaction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx2", "ruff>=0.6", "mypy>=1.10"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]
voyage = ["voyageai>=0.2"]
openai = ["openai>=1.0"]
sentence-transformers = ["sentence-transformers>=2.2"]
llm = ["anthropic>=0.40"]
vector-index = ["sqlite-vec>=0.1"]

[project.scripts]
emem = "effective_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effective_memory = ["web/*.html"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
